---
docker_gpg_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
docker_repo_url: "docker_repo_url: "deb [arch={{ ansible_facts['architecture'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
"
docker_users:
  - vagrant
