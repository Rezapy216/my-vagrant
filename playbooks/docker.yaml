---
- name: install docker
  hosts: docker
  become: true

  tasks:
    - name: install dependencies
      apt:
        name:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - lsb-release

        state: present
        update_cache: true

    - name: ensure apt keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: download docker GPG key
      get_url:
        url: "{{ docker_gpg_url }}"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: add docker apt repository
      apt_repository:
        repo: "{{ docker_repo_url }}"
        state: present
        filename: docker

    - name: install docker engin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: enable and start docker service
      service:
        name: docker
        state: started
        enabled: yes
      


    - name: add users to docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"
        
